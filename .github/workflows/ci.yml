name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check extension.js
          node --check media/view.js
      - name: Package
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: krplot-vsix
          path: "*.vsix"
