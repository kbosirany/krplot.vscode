name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httpgd
      - name: Check syntax
        run: |
          node --check extension.js
          node --check session.js
          node --check media/view.js
      - name: Test
        run: npm test
        env:
          KRPLOT_REQUIRE_R: "1"

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: krplot-vsix
          path: "*.vsix"

  # On a v* tag: GitHub release with the .vsix and the CHANGELOG entry
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: krplot-vsix
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          awk -v v="[$version]" '
            /^## \[/ { p = index($0, v) > 0; next }
            /^\[[^]]+\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" krplot-"$version".vsix \
            --title "krplot $version" --notes-file notes.md
