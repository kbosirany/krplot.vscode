name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httpgd
      - name: Check syntax
        run: |
          node --check extension.js
          node --check session.js
          node --check media/view.js
      - name: Test
        run: npm test
        env:
          KRPLOT_REQUIRE_R: "1"

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: krplot-vsix
          path: "*.vsix"
